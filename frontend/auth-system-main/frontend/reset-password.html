<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arial Sense — Reset Password</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="simple-page-body">

  <div class="auth-wrapper">
    <div class="card">

      <!-- Brand -->
      <div class="brand">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M9 2L15.5 14H2.5L9 2Z" fill="white" fill-opacity="0.9"/>
            <path d="M9 7L12 13H6L9 7Z" fill="white" fill-opacity="0.35"/>
          </svg>
        </div>
        <span class="brand-name">Arial Sense</span>
      </div>

      <!-- Page icon + heading -->
      <div class="page-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>

      <h1 class="page-title">Set a new password</h1>
      <p class="page-sub">
        Your new password must be at least 8 characters and include
        uppercase, lowercase, a number, and a special character.
      </p>

      <!-- Dynamic status (success / error messages) -->
      <div id="status"></div>

      <!-- Reset form -->
      <form id="reset-form" novalidate>

        <div class="field">
          <label for="rp-password">New Password</label>
          <div class="input-wrap">
            <input
              id="rp-password" type="password" name="password"
              placeholder="••••••••" autocomplete="new-password"
              class="has-toggle" required
            />
            <button type="button" class="pw-toggle">Show</button>
          </div>
          <div class="strength-track">
            <div class="strength-fill" id="strength-fill"></div>
          </div>
        </div>

        <div class="field">
          <label for="rp-confirm">Confirm Password</label>
          <div class="input-wrap">
            <input
              id="rp-confirm" type="password" name="confirm_password"
              placeholder="••••••••" autocomplete="new-password"
              class="has-toggle" required
            />
            <button type="button" class="pw-toggle">Show</button>
          </div>
        </div>

        <button type="submit" class="btn-primary">Reset Password</button>
      </form>

      <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted);">
        <a href="index.html" style="color:var(--primary);text-decoration:none;">Back to sign in</a>
      </p>

    </div>
  </div>

  <script src="app.js?v=3"></script>
  <script>initResetPasswordPage();</script>
</body>
</html>
