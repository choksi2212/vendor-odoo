<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arial Sense — Verify Email</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="simple-page-body">

  <div class="auth-wrapper">
    <div class="card">

      <!-- Brand -->
      <div class="brand">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M9 2L15.5 14H2.5L9 2Z" fill="white" fill-opacity="0.9"/>
            <path d="M9 7L12 13H6L9 7Z" fill="white" fill-opacity="0.35"/>
          </svg>
        </div>
        <span class="brand-name">Arial Sense</span>
      </div>

      <!-- Page icon + heading -->
      <div class="page-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07"/>
          <path d="M14.05 2.09a20 20 0 0 1 7.9 7.86"/>
          <polyline points="22 2 11 13"/>
          <polyline points="11 13 11 21"/>
          <path d="M2 2l20 20"/>
        </svg>
      </div>

      <h1 class="page-title">Email Verification</h1>
      <p class="page-sub">
        Please wait while we verify your email address&hellip;
      </p>

      <!-- Dynamic status injected by app.js -->
      <div id="status"></div>

    </div>
  </div>

  <script src="app.js?v=3"></script>
  <script>initVerifyEmailPage();</script>
</body>
</html>
